<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>birdseye · explore</title>
  <meta name="description" content="Browse every city and image in the birdseye quiz." />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f6f4ef" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23151619'/><circle cx='32' cy='32' r='10' fill='%23ffe7c9'/></svg>" />
  <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
  <link rel="preconnect" href="https://flagcdn.com" crossorigin />
  <link rel="dns-prefetch" href="https://upload.wikimedia.org" />
  <link rel="dns-prefetch" href="https://flagcdn.com" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="explore">
  <div class="cursor-halo" id="cursorHalo" aria-hidden="true"></div>

  <main class="explore">
    <header class="explore-head">
      <a class="pill pill-icon" href="./index.html" title="back to quiz" aria-label="back to quiz">←</a>

      <label class="pill pill-search">
        <input id="search" class="search-input" type="search" placeholder="search cities…" autocomplete="off" spellcheck="false" />
        <button id="searchClear" class="search-clear" aria-label="clear" type="button">×</button>
      </label>

      <select id="sourceSelect" class="select-pill" aria-label="filter by image source">
        <option value="all">all sources</option>
      </select>
    </header>

    <div class="filter-row">
      <div class="pill filter-group" id="contPill" role="tablist" aria-label="continent">
        <button class="mode-btn is-active" data-cont="all">all</button>
        <button class="mode-btn" data-cont="Europe">europe</button>
        <button class="mode-btn" data-cont="Asia">asia</button>
        <button class="mode-btn" data-cont="Americas">americas</button>
        <button class="mode-btn" data-cont="Africa">africa</button>
        <button class="mode-btn" data-cont="Oceania">oceania</button>
      </div>
      <div class="pill filter-group" id="tierPill" role="tablist" aria-label="tier">
        <button class="mode-btn is-active" data-tier="all">all</button>
        <button class="mode-btn" data-tier="1">t1</button>
        <button class="mode-btn" data-tier="2">t2</button>
        <button class="mode-btn" data-tier="3">t3</button>
        <button class="mode-btn" data-tier="4">t4</button>
      </div>
      <select id="sortSelect" class="select-pill" aria-label="sort cities">
        <option value="name">name a–z</option>
        <option value="name-desc">name z–a</option>
        <option value="country">country</option>
        <option value="tier">tier · famous first</option>
        <option value="images">most images</option>
      </select>
    </div>

    <div class="explore-meta" id="exploreMeta">loading…</div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>no cities match these filters.</div>
  </main>

  <div class="modal-back" id="modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <div>
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-sub" id="modalSub"></div>
        </div>
        <button class="modal-close" id="modalClose" aria-label="close" type="button">×</button>
      </header>
      <div class="modal-main">
        <img id="modalMain" alt="" decoding="async" />
      </div>
      <div class="modal-info" id="modalInfo"></div>
      <div class="modal-thumbs" id="modalThumbs"></div>
    </div>
  </div>

  <script type="module" src="./explore.js"></script>
</body>
</html>
